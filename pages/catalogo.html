<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuidado Capilar — BioLand</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="../assets/css/main.css?v=4">
  <link rel="stylesheet" href="../assets/css/components.css?v=4">
  <style>
    /* ── Category banner collage (3-panel grid top) ─── */
    .cat-banner {
      display: grid;
      grid-template-columns: 3fr 2fr;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      height: 230px;
      margin: 12px auto 32px;
    }
    @media (min-width: 768px)  { .cat-banner { height: 320px; } }
    @media (min-width: 1024px) { .cat-banner { height: 500px; } }
    @media (min-width: 1280px) { .cat-banner { height: 550px; } }

    .cat-banner__main {
      grid-column: 1; grid-row: 1 / 3;
      position: relative; overflow: hidden;
    }
    .cat-banner__side-top    { grid-column: 2; grid-row: 1; position: relative; overflow: hidden; }
    .cat-banner__side-bottom { grid-column: 2; grid-row: 2; position: relative; overflow: hidden; }

    .cat-banner a {
      display: block; width: 100%; height: 100%;
    }
    .cat-banner img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .cat-banner__label {
      position: absolute; bottom: 0; left: 0; width: 100%;
      text-align: center;
      padding: 16px 8px;
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.15em; color: #001689;
      background: transparent;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    @media (min-width: 768px)  { .cat-banner__label { font-size: 14px; padding: 32px 8px 12px; } }
    @media (min-width: 1024px) { .cat-banner__label { font-size: 20px; padding: 40px 8px 16px; } }

    /* ── Family grid ─────────────────────────────────── */
    .family-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (min-width: 768px) { .family-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 1024px) { .family-grid { gap: 32px; } }

    .family-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--brand);
      text-decoration: none;
    }
    .family-card__img-wrap {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid #E5E7EB;
      transition: border-color 0.2s;
    }
    .family-card:hover .family-card__img-wrap { border-color: rgba(0,22,137,0.25); }
    .family-card__img-wrap img {
      width: 100%; height: 100%; object-fit: contain;
    }
    .family-card__name {
      font-size: 14px;
      font-weight: 700;
      text-transform: capitalize;
      margin-top: 8px;
      color: var(--brand);
    }
    @media (min-width: 1024px) { .family-card__name { font-size: 21px; } }

    /* ── Destacados swiper ─────────────────────────────── */
    .destacados-swiper {
      overflow: hidden;
    }
    .destacados-swiper .swiper-slide {
      max-width: 240px;
      padding-bottom: 48px;
    }
    .destacados-swiper .swiper-button-next,
    .destacados-swiper .swiper-button-prev {
      color: var(--brand);
    }
    .destacados-swiper .swiper-button-next::after,
    .destacados-swiper .swiper-button-prev::after {
      font-size: 20px;
    }

    /* ── Familia sub-page ──────────────────────────────────── */
    .familia-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 32px 0;
      flex-wrap: wrap;
      gap: 16px;
    }
    .familia-header h1 {
      font-size: clamp(32px,4vw,48px);
      font-weight: 700;
      color: var(--brand);
      margin: 0;
    }
    .btn-ver-todos {
      display: inline-block;
      padding: 10px 28px;
      border: 2px solid var(--brand);
      color: var(--brand);
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }
    .btn-ver-todos:hover { background: var(--brand); color: #fff; }

    .familia-product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      padding-bottom: 80px;
    }
    @media (min-width: 640px)  { .familia-product-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) { .familia-product-grid { grid-template-columns: repeat(4, 1fr); gap: 32px; } }
    @media (min-width: 1280px) { .familia-product-grid { grid-template-columns: repeat(5, 1fr); } }

    /* ── Inline product detail ──────────────────────────── */
    .product-detail { display: none; padding-top: 56px; padding-bottom: 80px; }
    .product-detail.is-open { display: block; }

    .product-detail__back {
      display: inline-flex; align-items: center; gap: 8px;
      background: none; border: none; padding: 0; cursor: pointer;
      color: var(--brand); font-family: inherit; font-size: 13px;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 40px; transition: opacity 0.15s;
    }
    .product-detail__back:hover { opacity: 0.65; }

    .product-detail__grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      margin-bottom: 80px;
    }
    @media (min-width: 768px) {
      .product-detail__grid { grid-template-columns: 1fr 1fr; gap: 48px 72px; }
    }

    .product-detail__img-wrap {
      display: flex; align-items: center; justify-content: center;
      min-height: 320px;
    }
    .product-detail__img {
      max-height: 520px; width: 100%; object-fit: contain;
    }

    .product-detail__info { position: relative; }

    /* Ingredient element badge — identical to .ing-pill-btn in ingredientes.html */
    .product-detail__element {
      position: absolute; top: -20px; right: 0;
      width: 82px; height: 100px;
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: flex-start;
      padding: 4px 16px;
      border-bottom-right-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    @media (min-width: 768px) {
      .product-detail__element { top: 0; width: 98px; height: 110px; }
    }
    .product-detail__el-symbol {
      font-size: 26px; font-weight: 700; color: #fff; line-height: 1.1;
    }
    @media (min-width: 768px) { .product-detail__el-symbol { font-size: 32px; } }
    .product-detail__el-name {
      font-size: 11px; color: #fff; line-height: 1.3;
    }

    .product-detail__name {
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 700; color: var(--brand); line-height: 1.5;
      margin-bottom: 8px;
      padding-right: 96px; /* room for badge */
    }
    .product-detail__type {
      font-size: clamp(22px, 2.5vw, 32px); line-height: 1;
      color: var(--text-secondary); margin-bottom: 28px;
    }
    .product-detail__desc {
      font-size: 20px; line-height: 1.75;
      color: var(--text-secondary); margin-bottom: 36px;
    }

    /* Tabs */
    .product-detail__tabs {
      display: flex; border-bottom: 1px solid #e0e0e0; margin-bottom: 24px;
    }
    .product-detail__tab {
      flex: 1; padding: 10px 12px;
      background: none; border: none;
      border-bottom: 3px solid transparent; margin-bottom: -1px;
      font-family: inherit; font-size: 20px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
      cursor: pointer; color: #aaa;
      transition: color 0.15s, border-color 0.15s;
    }
    .product-detail__tab:first-child { text-align: left; }
    .product-detail__tab:last-child  { text-align: right; }
    .product-detail__tab.is-active   { color: var(--brand); border-bottom-color: var(--brand); }

    .product-detail__panel { display: none; }
    .product-detail__panel.is-active { display: block; }

    .product-detail__list {
      list-style: none; padding: 0; margin: 0;
      display: flex; flex-direction: column; gap: 14px;
    }
    .product-detail__list li {
      display: flex; align-items: center; gap: 14px;
      font-size: 20px; line-height: 1.4; color: var(--text-secondary);
    }
    .product-detail__list li::before {
      content: ''; flex-shrink: 0;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-secondary);
    }

    .product-detail__ing-text {
      font-size: 14px; line-height: 1.8;
      color: var(--text-secondary);
    }

    /* Relacionados */
    .product-detail__rel-title {
      font-size: clamp(24px,3vw,36px); font-weight: 700;
      color: var(--brand); margin-bottom: 32px;
    }
    .product-detail__rel-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); gap: 24px;
    }
    @media (min-width: 640px)  { .product-detail__rel-grid { grid-template-columns: repeat(3,1fr); } }
    @media (min-width: 1024px) { .product-detail__rel-grid { grid-template-columns: repeat(4,1fr); gap: 32px; } }
  </style>
</head>
<body>

  <!-- Nav inyectado por JS -->
  <script src="../components/header.js?v=4" data-root=".."></script>

  <main class="padding-for-nav fade-in">

    <!-- ── Banner collage 3-panel (populated by JS) ───── -->
    <section class="cat-banner container mx-auto" id="cat-banner"></section>

    <!-- ── Listado de familias ─────────────────────────── -->
    <section class="container mx-auto" style="padding-inline:clamp(30px,4vw,64px);" id="families-section">
      <h1 id="cat-title" style="font-size:clamp(32px,4vw,48px);font-weight:700;color:var(--brand);margin:32px 0;"></h1>

      <div class="family-grid" id="family-grid"></div>

      <div style="margin-bottom:48px;"></div>
    </section>

    <!-- ── Vista sub-familia (populated by JS when ?familia= present) ── -->
    <section class="container mx-auto" style="padding-inline:clamp(30px,4vw,64px);display:none;" id="familia-section">
      <div class="familia-header">
        <h1 id="familia-title"></h1>
        <a id="familia-ver-todos" href="#" class="btn-ver-todos">Ver Todos</a>
      </div>
      <div class="familia-product-grid" id="familia-product-grid"></div>
    </section>

    <!-- ── Inline product detail (shown when a product card is clicked) ── -->
    <section class="container mx-auto product-detail" id="product-detail" style="padding-inline:clamp(30px,4vw,64px);">
      <button class="product-detail__back" id="product-detail-back">
        ← Volver
      </button>
      <div class="product-detail__grid">
        <div class="product-detail__img-wrap">
          <img class="product-detail__img" id="pd-img" src="" alt="">
        </div>
        <div class="product-detail__info">
          <div class="product-detail__element" id="pd-element">
            <span class="product-detail__el-symbol" id="pd-el-symbol"></span>
            <span class="product-detail__el-name"   id="pd-el-name"></span>
          </div>
          <h1 class="product-detail__name" id="pd-name"></h1>
          <p  class="product-detail__type" id="pd-type"></p>
          <p  class="product-detail__desc" id="pd-desc"></p>
          <div class="product-detail__tabs">
            <button class="product-detail__tab is-active" data-tab="no-contiene">No Contiene</button>
            <button class="product-detail__tab"           data-tab="ingredientes">Ingredientes</button>
          </div>
          <div class="product-detail__panel is-active" id="pd-panel-no-contiene">
            <ul class="product-detail__list" id="pd-no-contiene"></ul>
          </div>
          <div class="product-detail__panel" id="pd-panel-ingredientes">
            <p class="product-detail__ing-text" id="pd-ingredientes"></p>
          </div>
        </div>
      </div>
      <h2 class="product-detail__rel-title">Relacionados</h2>
      <div class="product-detail__rel-grid" id="pd-related"></div>
    </section>

    <!-- ── Destacados (solo facial y corporal) ───────────── -->
    <section class="container mx-auto" id="destacados-section" style="display:none;padding-inline:clamp(30px,4vw,64px);padding-bottom:80px;">
      <h2 id="destacados-title" style="font-size:clamp(24px,3vw,40px);font-weight:700;color:var(--brand);margin-bottom:32px;">Destacados</h2>
      <div class="swiper destacados-swiper">
        <div class="swiper-wrapper" id="destacados-grid"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="../components/footer.js" data-root=".."></script>
  <script src="../assets/js/main.js"></script>
  <script>
  // ── Catalog data ──────────────────────────────────────────
  const CATALOG = {
    capilar: {

        { name: 'Aloe Vera',           img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Aloe-Vera-1024x1024.jpg' },

        { name: 'Bio Colágeno',        img: 'https://admin.bio-land.com/wp-content/uploads/2024/10/F-BioColageno-copy-1024x1024.jpg' },
        { name: 'Coco',                img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Coco-1024x1024.jpg' },
        { name: 'Infusión de Romero',  img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Infusion-Romero-1024x1024.jpg' },
        { name: 'Leche de Coco',       img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Leche-Coco-1024x1024.jpg' },
        { name: 'Linaza',              img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Linaza1-1024x1024.jpg' },
        { name: 'Manzanilla',          img: 'https://admin.bio-land.com/wp-content/uploads/2024/10/F-Manzanilla-copy-1024x1024.jpg' },
        { name: 'Ortiga',              img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Ortiga-1024x1024.jpg' },
        { name: 'Pro Keratina',        img: 'https://admin.bio-land.com/wp-content/uploads/2024/10/F-ProKeratina-1024x1024.jpg' },
        { name: 'Romero',              img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Romero-1024x1024.jpg' },
      ]
    },
    facial: {
      name: 'Cuidado Facial',
      banner: 'https://admin.bio-land.com/wp-content/uploads/2024/06/FA1-1024x755.jpg',
      families: [
        { name: 'Aloe Vera',              img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Aloe-Vera-1-1024x1024.jpg' },
        { name: 'Barras Faciales',        img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Barras-faciales-1024x1024.jpg' },
        { name: 'Bio Colágeno',           img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-BioColageno-1024x1024.jpg' },
        { name: 'Tratamientos Faciales',  img: 'https://admin.bio-land.com/wp-content/uploads/2024/10/F-Especializadas-1024x1024.jpg' },
        { name: 'Limpieza Facial',        img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Limpieza-1024x1024.jpg' },
        { name: 'Mascarillas',            img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Mascarillas-1024x1024.jpg' },
        { name: 'Vitamin C',              img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Aclarado-1024x1024.jpg' },
      ],
      destacados: [
        { name: 'Gel Limpiador Vitamin C',               cat: 'Limpieza Facial',      vol: '200ml', img: '../assets/img/F6.png',  slug: 'gel-limpiador-vitamin-c' },
        { name: 'Agua Micelar Vitamin C',                cat: 'Limpieza Facial',      vol: '310ml', img: '../assets/img/F7.png',  slug: 'agua-micelar-vitamin-c' },
        { name: 'Serum Antimanchas Vitamin C',           cat: 'Suero Facial',         vol: '30ml',  img: '../assets/img/F5.png',  slug: 'serum-antimanchas-vitamin-c' },
        { name: 'Contorno de Ojos Vitamin C',            cat: 'Tratamiento Facial',   vol: '20ml',  img: '../assets/img/F3.png',  slug: 'contorno-ojos-vitamin-c' },
        { name: 'Crema Facial Humectante Vitamin C',     cat: 'Crema Facial',         vol: '50ml',  img: '../assets/img/F4.png',  slug: 'crema-facial-humectante-vitamin-c' },
        { name: 'Gel Aloe Vera',                         cat: 'Gel Facial',           vol: '300ml', img: '../assets/img/F22.png', slug: 'gel-aloe-vera' },
        { name: 'Gel Aloe Vera Refrescante After Sun',   cat: 'Gel Facial',           vol: '300ml', img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F21-1024x1024.png', slug: 'gel-aloe-vera-refrescante-after-sun' },
        { name: 'Gel Nutritivo Aloe Vitamina E',         cat: 'Tratamiento Facial',   vol: '150ml', img: '../assets/img/F20.png', slug: 'gel-nutritivo-aloe-vitamina-e' },
      ]
    },
    corporal: {
      name: 'Cuidado Corporal',
      banner: 'https://admin.bio-land.com/wp-content/uploads/2024/06/COR1-1024x755.jpg',
      families: [
        { name: 'Barra Corporal 90g',   img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Jabon-Barra-90-1024x1024.jpg' },
        { name: 'Barra Corporal 125g',  img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Jabon-Barra-125-1024x1024.jpg' },
        { name: 'Barra Corporal 270g',  img: 'https://admin.bio-land.com/wp-content/uploads/2024/11/F-Jabon-Barra-270-1024x1024.jpg' },
        { name: 'Barra Corporal 540g',  img: 'https://admin.bio-land.com/wp-content/uploads/2024/11/F-Jabon-Barra-540-1024x1024.jpg' },
        { name: 'Geles De Baño',        img: 'https://admin.bio-land.com/wp-content/uploads/2024/10/F-Gel-Bano-1024x1024.jpg' },
      ],
      destacados: [
        { name: 'Infusión de Romero Largo Extremo',               cat: 'Shampoo',          vol: '400ml', img: '../assets/img/SHAC13.png', slug: 'infusion-romero-shampoo' },
        { name: 'Infusión de Romero Largo Extremo',               cat: 'Acondicionador',   vol: '300ml', img: '../assets/img/SHAC12.png', slug: 'infusion-romero-acondicionador' },
        { name: 'Jabón Aloe Vera Regenerativo',                   cat: 'Jabón en Barra',   vol: '90g',   img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/F-Jabon-Barra-90-1024x1024.jpg', slug: 'jabon-aloe-vera-regenerativo' },
        { name: 'Acondicionador Concentrado Pro Keratina Restauración', cat: 'Acondicionador', vol: '180ml', img: '../assets/img/AC4.png', slug: 'concentrado-pro-keratina-restauracion' },
        { name: 'Acondicionador Concentrado Argán Humectación',   cat: 'Acondicionador',   vol: '180ml', img: '../assets/img/AC1.png',    slug: 'concentrado-argan-humectacion' },
        { name: 'Leche de Coco',                                  cat: 'Gel de Baño',      vol: '600ml', img: '../assets/img/VG12.png',   slug: 'leche-de-coco-gel-de-bano' },

        { name: 'Aloe Vera',                                      cat: 'Gel de Baño',      vol: '600ml', img: '../assets/img/VG11.png',   slug: 'aloe-vera-gel-de-bano' },
      ]
    }
  };

  // Side panel order for each active category
  const SIDES = {
    capilar:  ['corporal', 'facial'],
    facial:   ['capilar',  'corporal'],
    corporal: ['facial',   'capilar'],
  };

  // ── Init ─────────────────────────────────────────────────
  const params  = new URLSearchParams(location.search);
  const catKey  = CATALOG[params.get('cat')] ? params.get('cat') : 'capilar';
  const cat     = CATALOG[catKey];
  const [s1key, s2key] = SIDES[catKey];
  const side1   = CATALOG[s1key];
  const side2   = CATALOG[s2key];

  // Page title
  document.title = cat.name + ' — BioLand';
  document.getElementById('cat-title').textContent = cat.name;

  // Banner
  function panelHTML(data, slug, cls) {
    return `<div class="${cls}">
      <a href="catalogo.html?cat=${slug}">
        <img src="${data.banner}" alt="${data.name}">
        <span class="cat-banner__label">${data.name}</span>
      </a>
    </div>`;
  }
  document.getElementById('cat-banner').innerHTML =
    panelHTML(cat,   catKey, 'cat-banner__main') +
    panelHTML(side1, s1key,  'cat-banner__side-top') +
    panelHTML(side2, s2key,  'cat-banner__side-bottom');

  // Family grid
  document.getElementById('family-grid').innerHTML = cat.families.map(f => {
    const slug = f.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'-');
    return `<a class="family-card" href="catalogo.html?cat=${catKey}&familia=${slug}">
      <div class="family-card__img-wrap">
        <img src="${f.img}" alt="${f.name}" loading="lazy">
      </div>
      <h4 class="family-card__name">${f.name}</h4>
    </a>`;
  }).join('');

  // ── Familia sub-page handler ─────────────────────────────
  const FAMILY_PRODUCTS = {
    'aceite-de-coco': {
      products: [
        {
          name: 'Aceite de Coco Brillo Intenso', type: 'Shampoo', vol: '400ml',
          img: '../assets/img/product-aceite-coco.jpeg',
          slug: 'aceite-de-coco',
          element: { symbol: 'Co', name: 'Coco', color: '#E9A72A' },

        },
        {
          name: 'Aceite de Coco Brillo Intenso', type: 'Acondicionador', vol: '400ml',
          img: '../assets/img/product-aceite-coco.jpeg',
          slug: 'aceite-de-coco-2',
          element: { symbol: 'Co', name: 'Coco', color: '#E9A72A' },
          desc: 'Aporta brillo intenso desde el primer uso, aumentando el nivel de hidratación del cabello. Fortalece y renueva el desgaste natural de las hebras capilares gracias a su alta concentración de aceite de coco.',
          noContiene: ['Sal','Sulfatos','Parabenos','Colorantes Artificiales','Derivados de origen animal','Aceite Mineral'],
          ingredientes: ['Aqua','Cetearyl Alcohol','Behentrimonium Chloride','Cocos Nucifera (Coconut) Oil','Glycerin','Amodimethicone','Citric Acid','Sodium Benzoate','Parfum']
        }
      ]
    },
    'argan': {
      products: [
        { name: 'Argán Hidratación Y Brillo', type: 'Crema para Peinar',      vol: '300ml', img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/CP7.jpg',                  slug: 'argan-6' },
        { name: 'Argán Hidratación Y Brillo', type: 'Fijador en Crema',       vol: '175ml', img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/Artboard-1-copy-20-1.jpg', slug: 'argan-5' },
        { name: 'Argán Hidratación Y Brillo', type: 'Acondicionador',         vol: '400ml', img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/SHAC31.jpg',               slug: 'argan-3' },
        { name: 'Argán Hidratación Y Brillo', type: 'Gel Fijador',            vol: '375ml', img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/GF4-1.jpg',                slug: 'argan-4' },
        { name: 'Argán Hidratación Y Brillo', type: 'Bifásico',               vol: '110ml', img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/ACE2.jpg',                 slug: 'argan-7' },
        { name: 'Argán Hidratación Y Brillo', type: 'Tratamiento Capilar',    vol: '300ml', img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/TC1.jpg',                  slug: 'argan-9' },
        { name: 'Argán Hidratación Y Brillo', type: 'Shampoo',                vol: '400ml', img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/Artboard-1-copy-21-1.jpg', slug: 'argan' },
        { name: 'Argán Hidratación Y Brillo', type: 'Shampoo',                vol: '700ml', img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/CP6.jpg',                  slug: 'argan-2' },
        { name: 'Argán Hidratación Y Brillo', type: 'Aceite Capilar',         vol: '110ml', img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/ACE-4.jpg',                slug: 'argan-8' },
        { name: 'Acondicionador Concentrado Argán Humectación', type: 'Acondicionador', vol: '180ml', img: 'https://admin.bio-land.com/wp-content/uploads/2024/09/AC1.jpg', slug: 'concentrado-argan-humectacion' },
      ]
    }
  };

  const familiaSlug = params.get('familia');
  if (familiaSlug) {
    // Switch views: hide category view, show familia view
    document.getElementById('cat-banner').style.display = 'none';
    document.getElementById('families-section').style.display = 'none';
    document.getElementById('destacados-section').style.display = 'none';
    const famSection = document.getElementById('familia-section');
    famSection.style.display = '';

    // Find family name from catalog
    const famEntry = cat.families.find(f =>
      f.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'-') === familiaSlug
    );
    const famName = famEntry ? famEntry.name : familiaSlug;
    document.getElementById('familia-title').textContent = famName;
    document.getElementById('familia-ver-todos').href = `catalogo.html?cat=${catKey}`;
    document.title = famName + ' — BioLand';

    // Render products
    const famData = FAMILY_PRODUCTS[familiaSlug];
    const grid = document.getElementById('familia-product-grid');
    if (famData && famData.products.length) {
      grid.innerHTML = famData.products.map(p => `
        <div class="product-card-link" role="button" tabindex="0"
             style="cursor:pointer;" onclick="openProduct('${p.slug}','${familiaSlug}')">
          <div class="product-card-img-wrap">
            <img src="${p.img}" alt="${p.name}" class="product-card-img" loading="lazy">
          </div>
          <h4 class="product-card-name">${p.name}</h4>
          <p class="product-card-category">${p.type}</p>
          <p class="product-card-volume">${p.vol}</p>
        </div>`).join('');
    } else {
      grid.innerHTML = '<p style="color:var(--text-secondary);padding:24px 0;">Productos próximamente.</p>';
    }
  }

  // ── Product detail panel ─────────────────────────────────
  function openProduct(slug, famSlug) {
    const famData = FAMILY_PRODUCTS[famSlug];
    if (!famData) return;
    const p = famData.products.find(x => x.slug === slug);
    if (!p) return;

    // Fill fields
    document.getElementById('pd-img').src = p.img;
    document.getElementById('pd-img').alt = p.name + ' ' + p.type;
    document.getElementById('pd-element').style.background = p.element.color;
    document.getElementById('pd-el-symbol').textContent = p.element.symbol;
    document.getElementById('pd-el-name').textContent   = p.element.name;
    document.getElementById('pd-name').textContent = p.name;
    document.getElementById('pd-type').textContent = p.type;
    document.getElementById('pd-desc').textContent = p.desc;

    document.getElementById('pd-no-contiene').innerHTML =
      p.noContiene.map(i => `<li>${i}</li>`).join('');
    document.getElementById('pd-ingredientes').textContent =
      p.ingredientes.join(', ') + '.';

    // Related: other products in same family
    const related = famData.products.filter(x => x.slug !== slug);
    document.getElementById('pd-related').innerHTML = related.map(r => `
      <div class="product-card-link" role="button" tabindex="0"
           style="cursor:pointer;" onclick="openProduct('${r.slug}','${famSlug}')">
        <div class="product-card-img-wrap">
          <img src="${r.img}" alt="${r.name}" class="product-card-img" loading="lazy">
        </div>
        <h4 class="product-card-name">${r.name}</h4>
        <p class="product-card-category">${r.type}</p>
        <p class="product-card-volume">${r.vol}</p>
      </div>`).join('') || '<p style="color:var(--text-secondary)">No hay productos relacionados.</p>';

    // Reset tabs
    document.querySelectorAll('.product-detail__tab').forEach(t => t.classList.remove('is-active'));
    document.querySelectorAll('.product-detail__panel').forEach(p => p.classList.remove('is-active'));
    document.querySelector('.product-detail__tab[data-tab="no-contiene"]').classList.add('is-active');
    document.getElementById('pd-panel-no-contiene').classList.add('is-active');

    // Toggle views
    document.getElementById('familia-section').style.display = 'none';
    document.getElementById('product-detail').classList.add('is-open');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Back button
  document.getElementById('product-detail-back').addEventListener('click', () => {
    document.getElementById('product-detail').classList.remove('is-open');
    document.getElementById('familia-section').style.display = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // Tab switching
  document.querySelectorAll('.product-detail__tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.product-detail__tab').forEach(t => t.classList.remove('is-active'));
      document.querySelectorAll('.product-detail__panel').forEach(p => p.classList.remove('is-active'));
      btn.classList.add('is-active');
      document.getElementById('pd-panel-' + btn.dataset.tab).classList.add('is-active');
    });
  });

  // Destacados swiper (only for facial and corporal)
  if (!familiaSlug && cat.destacados && cat.destacados.length) {
    const section = document.getElementById('destacados-section');
    section.style.display = '';
    document.getElementById('destacados-grid').innerHTML = cat.destacados.map(p => `
      <div class="swiper-slide" style="max-width:240px;padding-bottom:48px;">
        <a class="product-card-link" href="producto.html?slug=${p.slug}">
          <div class="product-card-img-wrap"><img src="${p.img}" alt="${p.name}" class="product-card-img" loading="lazy"></div>
          <h4 class="product-card-name">${p.name}</h4>
          <p class="product-card-category">${p.cat}</p>
          <p class="product-card-volume">${p.vol}</p>
        </a>
      </div>`).join('');

    new Swiper('.destacados-swiper', {
      slidesPerView: 'auto',
      spaceBetween: 24,
      navigation: { nextEl: '.destacados-swiper .swiper-button-next', prevEl: '.destacados-swiper .swiper-button-prev' },
    });
  }
  </script>
