<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aceite de Coco Brillo Intenso — BioLand</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="../assets/css/main.css?v=4">
  <link rel="stylesheet" href="../assets/css/components.css?v=4">
  <style>
    /* ── Product detail layout ───────────────────────── */
    .product-detail {
      display: grid;
      gap: 32px;
      padding: 48px 16px;
      max-width: 1536px;
      margin: 0 auto;
    }
    @media (min-width: 500px) { .product-detail { max-width: 500px; } }
    @media (min-width: 1024px) {
      .product-detail {
        grid-template-columns: 1fr 1fr;
        max-width: 100%;
        gap: 48px;
        padding: 48px 32px;
      }
    }

    /* Image swiper side */
    .product-img-swiper { overflow: hidden; }
    .product-img-swiper .swiper-slide img {
      width: 100%; height: 100%;
      object-fit: contain;
      padding-bottom: 16px;
      max-height: 500px;
    }
    @media (min-width: 768px) {
      .product-img-swiper .swiper-slide img { max-height: 600px; }
    }
    /* Progress bar under image */
    .product-img-progress {
      background: rgba(0,0,0,0.1);
      height: 4px;
      width: 100%;
      margin-top: 24px;
    }
    .product-img-progress-fill {
      height: 4px;
      width: 100%;
      background: var(--brand-dark);
    }

    /* Info side */
    .product-info { display: flex; flex-direction: column; }

    /* Ingredient badge — tall pill */
    .ingredient-pill {
      width: 98px;
      padding: 4px 16px;
      height: 110px;
      display: flex;
      flex-direction: column;
      gap: 0;
      align-items: flex-start;
      justify-content: flex-start;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      border-bottom-right-radius: 16px;
      cursor: pointer;
      text-decoration: none;
    }
    .ingredient-pill__abbr {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }
    .ingredient-pill__name {
      font-size: 11px;
      color: #fff;
      line-height: 1.3;
    }

    /* Product header grid */
    .product-header-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: center;
      gap: 8px;
    }
    @media (min-width: 1280px) {
      .product-header-grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
    }

    /* No contiene / Ingredientes tabs */
    .product-tabs {
      display: flex;
      width: 100%;
      margin-top: 40px;
    }
    @media (min-width: 1280px) { .product-tabs { margin-top: 64px; } }

    .product-tab-btn {
      flex: 1;
      padding: 8px 16px;
      font-size: var(--fs-label);
      font-weight: 700;
      text-transform: uppercase;
      text-align: left;
      background: transparent;
      border: none;
      border-bottom: 3px solid;
      cursor: pointer;
      color: var(--brand);
      border-bottom-color: var(--brand);
    }
    .product-tab-btn--inactive {
      text-align: right;
      color: var(--text-secondary);
      border-bottom-color: #e5e7eb;
      font-weight: 400;
    }
    .product-tab-content { padding: 24px 0; }

    .no-contiene-list {
      list-style: disc;
      list-style-position: inside;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      font-size: 20px;
    }
    .no-contiene-list li {
      padding: 8px;
      border-bottom: 0.625px solid #F3F4FF;
    }

    /* Related products */
    .related-section { padding: 48px 0; }
    .related-section h2 {
      font-size: clamp(28px,4vw,40px);
      font-weight: 700;
      color: var(--brand);
      padding: 0 16px;
      margin-bottom: 48px;
    }
    .related-swiper-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      padding: 0 40px;
    }
    .related-swiper-grad-r {
      position: absolute; top: 0; right: 0; height: 100%;
      width: 250px; background: linear-gradient(to left, #fff, transparent);
      z-index: 10; pointer-events: none;
    }
    .related-swiper-grad-l {
      position: absolute; top: 0; left: 0; height: 100%;
      width: 250px; background: linear-gradient(to right, #fff, transparent);
      z-index: 10; pointer-events: none; display: none;
    }
    @media (min-width: 1024px) { .related-swiper-grad-l { display: block; } }
  </style>
</head>
<body>

  <script src="../components/header.js?v=4" data-root=".."></script>

  <main class="padding-for-nav fade-in">

    <!-- ── Product detail ──────────────────────────────── -->
    <div class="product-detail container mx-auto">

      <!-- Left: image swiper (una sola imagen por producto — poblado por product.js) -->
      <div class="product-img-swiper">
        <div class="swiper product-img-swiper-inner">
          <div class="swiper-wrapper" id="pp-img-wrapper"></div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>
        </div>
        <div class="product-img-progress">
          <div class="product-img-progress-fill"></div>
        </div>
      </div>

      <!-- Right: product info (poblado por product.js desde getProducto()) -->
      <div class="product-info">

        <!-- Name + type + badge -->
        <div class="product-header-grid">
          <div style="grid-column:1/3;" class="xl:col-span-3">
            <h1 id="pp-nombre" style="color:var(--brand);font-size:clamp(28px,4vw,48px);font-weight:700;line-height:1.15;"></h1>
            <p id="pp-tipo" style="color:var(--text-secondary);font-size:clamp(18px,3vw,32px);"></p>
          </div>
          <!-- Ingredient pill badge -->
          <a class="ingredient-pill" id="pp-ing-pill" href="ingredientes.html"
             style="justify-self: end;">
            <span class="ingredient-pill__abbr" id="pp-ing-abbr"></span>
            <span class="ingredient-pill__name" id="pp-ing-name"></span>
          </a>
        </div>

        <!-- Description -->
        <p id="pp-desc" style="margin-top:64px;color:var(--text-secondary);font-size:20px;line-height:28px;"></p>

        <!-- Tabs -->
        <div class="product-tabs">
          <button class="product-tab-btn" id="tab-no-contiene" data-tab="no-contiene">No Contiene</button>
          <button class="product-tab-btn product-tab-btn--inactive" id="tab-ingredientes" data-tab="ingredientes">Ingredientes</button>
        </div>

        <!-- No contiene content -->
        <div class="product-tab-content" id="panel-no-contiene">
          <ul class="no-contiene-list" id="pp-no-contiene"></ul>
        </div>

        <!-- Ingredientes content -->
        <div class="product-tab-content" id="panel-ingredientes" style="display:none;">
          <p id="pp-ingredientes" style="color:var(--text-secondary);font-size:20px;line-height:1.8;"></p>
        </div>

      </div>
    </div>

    <!-- ── Related products (poblado por product.js: mismos productos de la familia) ── -->
    <section class="related-section container mx-auto" id="related-section" style="display:none;">
      <h2>Relacionados</h2>
      <div class="related-swiper-wrap">
        <div class="related-swiper-grad-r"></div>
        <div class="related-swiper-grad-l"></div>
        <div class="swiper related-swiper">
          <div class="swiper-wrapper" id="related-wrapper" style="align-items:center;"></div>
        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="../components/footer.js" data-root=".."></script>
  <script src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/product.js"></script>
</body>
</html>
