<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingredientes — BioLand</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="../assets/css/main.css?v=4">
  <link rel="stylesheet" href="../assets/css/components.css?v=4">
  <style>
    /* ── 1. Featured ingredient header ────────────────── */
    .ing-header {
      position: relative;
      width: 100%;
      height: 100vh;
      max-height: 640px;
      overflow: visible;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Clip only the background image, not the decorative cutout */
    .ing-hero-bg {
      clip-path: inset(0);
    }
    .ing-hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      transition: opacity 0.4s;
    }
    .ing-hero-overlay {
      position: absolute;
      inset: 0;
      margin: 0 auto;
      max-width: clamp(480px, 60%, 922px);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      background: rgba(0,0,0,0.18);
      z-index: 1;
      overflow: visible;
    }
    .ing-hero-cutout {
      position: absolute;
      bottom: -48px;
      right: -8px;
      width: clamp(240px,22vw,300px);
      object-fit: contain;
      z-index: 2;
      pointer-events: none;
      opacity: 0.92;
    }
    .ing-featured {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 0 32px;
      text-align: center;
      width: 100%;
      max-width: clamp(480px, 60%, 922px);
      box-sizing: border-box;
    }
    .ing-feat-title {
      font-size: clamp(28px,4vw,48px);
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .ing-feat-desc {
      font-size: clamp(14px,1.4vw,20px);
      line-height: 1.75;
      color: rgba(255,255,255,0.92);
      max-width: 520px;
    }

    /* ── 2. Pill swiper strip (below hero) ───────────── */
    .ing-swiper-section {
      background: #fff;
      padding: 96px 0 32px;
    }
    .ing-swiper-wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 0 4px;
      overflow: hidden;
    }
    .ing-swiper .swiper-wrapper {
      height: 240px;
      align-items: center;
    }
    .ing-swiper .swiper-slide {
      width: auto;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      opacity: 0.2;
      transition: opacity 0.3s;
    }
    .ing-swiper .swiper-slide-active { opacity: 1; }
    .ing-swiper .swiper-slide-active .ing-pill-btn { transform: translateY(-16px); }

    /* ── Flechas: centradas entre card activa y adyacente ── */
    .ing-swiper .swiper-button-prev,
    .ing-swiper .swiper-button-next {
      width: 24px; height: 24px;
      top: 50%;
      transform: translateY(-50%) scale(0.6);
      color: #007AFF;
    }
    .ing-swiper .swiper-button-prev { left: calc(50% - 148px); }
    .ing-swiper .swiper-button-next { right: calc(50% - 148px); left: auto; }
    .ing-pill-btn {
      width: 98px; height: 110px;
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: flex-start;
      padding: 4px 16px;
      border-bottom-right-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      cursor: pointer;
      border: none;
      text-align: left;
      transition: transform 0.3s, box-shadow 0.3s, width 0.3s, height 0.3s;
      flex-shrink: 0;
    }
    .ing-pill-btn:hover { transform: scale(1.05); }
    .ing-swiper .swiper-slide-active .ing-pill-btn {
      width: 110px;
      height: 130px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    }
    .ing-pill-btn__abbr { font-size: 32px; font-weight: 700; color: #fff; line-height: 1.1; }
    .ing-pill-btn__name { font-size: 11px; color: #fff; line-height: 1.3; }

    /* ── 3. Category table (small pills) ─────────────── */
    .ing-table-section {
      padding: 0 0 32px;
      overflow-x: auto;
    }
    .ing-table {
      display: flex;
      flex-direction: row;
      gap: 0;
      justify-content: center;
      padding: 16px 16px 8px;
      flex-wrap: wrap;
    }
    .ing-col { display: flex; flex-direction: column; }
    .ing-col-pill {
      width: 98px; height: 110px;
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: flex-start;
      padding: 4px 16px;
      border-bottom-right-radius: 16px;
      margin: 4px;
      cursor: pointer;
      border: none;
      text-align: left;
      transition: transform 0.15s;
    }
    .ing-col-pill:hover { transform: scale(1.06); }
    .ing-col-pill--header {
      background: #fff !important;
      border: 2px solid transparent; /* color set inline */
      cursor: default;
      opacity: 1;
    }
    .ing-col-pill--header .ing-col-pill__abbr,
    .ing-col-pill--header .ing-col-pill__name { color: inherit; }
    .ing-col-pill:hover:not(.ing-col-pill--header) { transform: scale(1.06); }
    .ing-col-pill__abbr { font-size: 32px; font-weight: 700; line-height: 1.1; }
    .ing-col-pill__name { font-size: 11px; line-height: 1.3; }

    /* ── 4. Related products ──────────────────────────── */
    .related-section { padding: 48px 0 80px; }
    .related-section h2 {
      font-size: clamp(28px,4vw,48px);
      font-weight: 700;
      color: var(--brand);
      padding: 0 16px;
      margin-bottom: 48px;
    }
    .related-swiper-wrap {
      position: relative; overflow: hidden; padding: 0 40px;
    }
    .related-swiper-grad-r {
      position: absolute; top: 0; right: 0; height: 100%;
      width: 200px; background: linear-gradient(to left, #fff, transparent);
      z-index: 10; pointer-events: none;
    }
  </style>
</head>
<body>
  <script src="../components/header.js?v=4" data-root=".."></script>

  <main class="padding-for-nav fade-in">

    <!-- ── 1. Featured header ──────────────────────────── -->
    <header class="ing-header">
      <!-- Background photo -->
      <img class="ing-hero-bg" id="ing-bg-img"
           src="https://admin.bio-land.com/wp-content/uploads/2024/09/AdobeStock_311238682_11zon-scaled.jpeg"
           alt="">
      <!-- Blurred center overlay + plant cutout anchored to its corner -->
      <div class="ing-hero-overlay">
        <img class="ing-hero-cutout"
             src="https://admin.bio-land.com/wp-content/uploads/2024/09/AdobeStock_541135147_web.png"
             alt="">
      </div>
      <!-- Content -->
      <div class="ing-featured">
        <h2 class="ing-feat-title" id="feat-name"></h2>
        <p class="ing-feat-desc" id="feat-desc"></p>
      </div>
    </header>

    <!-- ── 2. Pill swiper (below hero) ───────────────────── -->
    <div class="ing-swiper-section">
      <div class="ing-swiper-wrap">
        <div class="swiper ing-swiper" id="ing-swiper">
          <div class="swiper-wrapper" id="ing-swiper-wrapper"></div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>
        </div>
      </div>
    </div>

    <!-- ── 2. Category table ────────────────────────────── -->
    <div class="ing-table-section">
      <div class="ing-table" id="ing-table"></div>
    </div>

    <!-- ── 3. Related products (poblado por ingredientes.js) ── -->
    <section class="related-section container mx-auto" style="display:none;">
      <h2>Relacionados</h2>
      <div class="related-swiper-wrap">
        <div class="related-swiper-grad-r"></div>
        <div class="swiper related-swiper">
          <div class="swiper-wrapper" style="align-items:center;"></div>
        </div>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="../components/footer.js" data-root=".."></script>
  <script src="../assets/js/main.js"></script>
  <script type="module" src="../assets/js/ingredientes.js"></script>
</body>
</html>
