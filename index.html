<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="En una Tierra llena de Vida la salud es un estado natural y la belleza su consecuencia.">
  <title>BioLand</title>

  <!-- Elfsight (Instagram feed) -->
  <script src="https://static.elfsight.com/platform/platform.js" async></script>
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <!-- Google Fonts: Dancing Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <!-- Site CSS -->
  <link rel="stylesheet" href="assets/css/main.css?v=4">

</head>
<body class="font-montserrat antialiased relative">

  <script src="components/header.js?v=4" data-root="."></script>

  <!-- ══ MAIN ══════════════════════════════════════════════ -->
  <main class="overflow-hidden home">

    <!-- ── HERO SWIPER (full screen) ──────────────────────── -->
    <div class="padding-for-nav hero-wrapper">
      <div class="swiper hero-swiper">
        <!-- Slides poblados por home.js desde getBanners() -->
        <div class="swiper-wrapper"></div>
        <!-- Scrollbar (igual que el real) -->
        <div class="swiper-scrollbar myhorizontalclass"></div>
      </div>
    </div>

    <!-- ── CUIDADO CAPILAR ─────────────────────────────────── -->
    <section class="category-section">
      <div class="category-section__header">
        <h2><a class="category-section__title" href="pages/catalogo.html?cat=capilar">Cuidado Capilar</a></h2>
      </div>
      <div class="category-section__banner"
           style="background-image:linear-gradient(180deg,#c5e8c550 0%,rgba(255,255,255,0) 50%),url('https://admin.bio-land.com/wp-content/uploads/2024/09/Bannerhome-v12-1372x555-1.jpg');background-size:cover;background-position:center;">
        <div class="category-section__swiper-wrap">
          <div class="swiper product-swiper-capilar" style="padding:16px 0 32px;">
            <!-- Slides poblados por home.js desde getProductos({categoria:'capilar'}) -->
            <div class="swiper-wrapper"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
          </div>
        </div>
        <div style="text-align:center;padding:0 0 28px;position:relative;z-index:1;">
          <a class="btn-more" href="pages/catalogo.html?cat=capilar">Ver Más</a>
        </div>
      </div>
    </section>

    <!-- ── CUIDADO FACIAL ──────────────────────────────────── -->
    <section class="category-section">
      <div class="category-section__header">
        <h2><a class="category-section__title" href="pages/catalogo.html?cat=facial">Cuidado Facial</a></h2>
      </div>
      <div class="category-section__banner"
           style="background-image:linear-gradient(180deg,#d7c3e550 0%,rgba(255,255,255,0) 50%),url('https://admin.bio-land.com/wp-content/uploads/2024/06/Bannerhome-v3-1372x555_.jpg');background-size:cover;background-position:center;">
        <div class="category-section__swiper-wrap">
          <div class="swiper product-swiper-facial" style="padding:16px 0 32px;">
            <!-- Slides poblados por home.js desde getProductos({categoria:'facial'}) -->
            <div class="swiper-wrapper"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
          </div>
        </div>
        <div style="text-align:center;padding:0 0 28px;position:relative;z-index:1;">
          <a class="btn-more" href="pages/catalogo.html?cat=facial">Ver Más</a>
        </div>
      </div>
    </section>

    <!-- ── CUIDADO CORPORAL ────────────────────────────────── -->
    <section class="category-section">
      <div class="category-section__header">
        <h2><a class="category-section__title" href="pages/catalogo.html?cat=corporal">Cuidado Corporal</a></h2>
      </div>
      <div class="category-section__banner"
           style="background-image:linear-gradient(180deg,#efbfde50 0%,rgba(255,255,255,0) 50%),url('https://admin.bio-land.com/wp-content/uploads/2024/06/Bannerhome-v10-1372x555-1.jpg');background-size:cover;background-position:center;">
        <div class="category-section__swiper-wrap">
          <div class="swiper product-swiper-corporal" style="padding:16px 0 32px;">
            <!-- Slides poblados por home.js desde getProductos({categoria:'corporal'}) -->
            <div class="swiper-wrapper"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
          </div>
        </div>
        <div style="text-align:center;padding:0 0 28px;position:relative;z-index:1;">
          <a class="btn-more" href="pages/catalogo.html?cat=corporal">Ver Más</a>
        </div>
      </div>
    </section>

    <!-- ── FILOSOFÍA / PROMESAS ────────────────────────────── -->
    <section class="philosophy-section">
      <div class="philosophy-section__inner">
        <h2 style="font-size:clamp(28px,4vw,40px);font-weight:700;color:var(--brand);text-align:center;">Nuestra filosofía</h2>

        <!-- Promesas -->
        <div class="promises-grid">
          <div class="promise-item">
            <img src="assets/img/promesas/promesas_colorantes.svg" alt="Sin colorantes artificiales" class="promise-icon">
            <p class="promise-label">Sin colorantes artificiales</p>
          </div>
          <div class="promise-item">
            <img src="assets/img/promesas/promesas_conejo.svg" alt="BioLand no experimenta en animales" class="promise-icon">
            <p class="promise-label">BioLand no experimenta en animales</p>
          </div>
          <div class="promise-item">
            <img src="assets/img/promesas/promesas_vaca.svg" alt="Sin ingredientes de origen animal" class="promise-icon">
            <p class="promise-label">Sin ingredientes de origen animal</p>
          </div>
          <div class="promise-item">
            <img src="assets/img/promesas/promesas_agua.svg" alt="Elaborado con agua de manantial" class="promise-icon">
            <p class="promise-label">Elaborado con agua de manantial</p>
          </div>
        </div>

        <a class="btn-outline" href="pages/nosotros.html">Conocer Más</a>
      </div>
    </section>

    <!-- ── NOVEDADES ───────────────────────────────────────── -->
    <section style="display:grid;gap:32px;padding:64px 0;place-items:center;">
      <h2 style="font-weight:700;font-size:clamp(28px,4vw,40px);color:var(--brand);">Novedades</h2>
      <div class="novedades-wrap">
        <div class="fade-right"></div>
        <div class="fade-left"></div>
        <div class="swiper novedades-swiper">
          <!-- Slides poblados por home.js desde getProductos({destacado:true}) -->
          <div class="swiper-wrapper"></div>
        </div>
      </div>
    </section>

    <!-- ── INSTAGRAM ─────────────────────────────────────── -->
    <section style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;margin:48px 0;">
      <img src="assets/img/branding/ig-logo.svg" alt="Instagram" style="height:clamp(36px,6vw,72px);width:auto;">
      <div style="width:100%;max-width:1200px;padding:0 16px;position:relative;">
        <div class="elfsight-app-dd14aff3-c5eb-4a57-a7db-cbf4b155d321" data-elfsight-app-lazy="true"></div>
        <!-- Cubre el badge gratuito de Elfsight -->
        <div style="position:absolute;bottom:0;left:0;right:0;height:36px;background:#fff;z-index:99;"></div>
      </div>
    </section>

  </main>
